name: salmon

# Only nginx is published to the host. The frontend and backend join a Docker
# network marked `internal: true`: they have no host ports AND no route to the
# outside world, so the only way to reach them is through the gateway.

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  nginx:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:stable-alpine
    ports:
      # The ONLY published port. Set BIND_ADDR=127.0.0.1 to keep it local.
      - "${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /tmp
    networks:
      - edge     # lets Docker publish the port to the host
      - private  # lets nginx reach frontend/backend
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

  frontend:
    <<: *hardening
    build:
      context: ./next-frontend/salmon
    expose:
      - "3000"   # visible to other containers only; NOT published to the host
    tmpfs:
      - /tmp
      - /app/.next/cache
    networks:
      - private
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    <<: *hardening
    build:
      context: ./fastapi-backend
    environment:
      # Browser origins allowed to call the API (same-origin through nginx
      # normally needs none, but keep this in sync with your public URL).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    expose:
      - "8000"   # visible to other containers only; NOT published to the host
    tmpfs:
      - /tmp
    networks:
      - private
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/').status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  edge: {}
  private:
    internal: true
