# Gateway config for nginxinc/nginx-unprivileged (listens on 8080, non-root).
# This file is mounted as /etc/nginx/conf.d/default.conf, i.e. inside `http {}`.

# Per-client request rate limits (keyed on client IP).
limit_req_zone $binary_remote_addr zone=web:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# Service names resolve through Docker's internal DNS on the private network.
upstream frontend {
    server frontend:3000;
    keepalive 16;
}

upstream backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 8080 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    # Reuse upstream connections.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Baseline security headers. (No Content-Security-Policy: Next.js emits
    # inline scripts, so a CSP needs nonces and should be designed separately.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Liveness probe for Docker; answered by nginx itself.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api/foo -> backend /foo  (the trailing slash on proxy_pass strips /api/)
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_read_timeout 30s;
        proxy_pass http://backend/;
    }

    # Everything else is the Next.js app.
    location / {
        limit_req zone=web burst=100 nodelay;
        limit_req_status 429;
        proxy_read_timeout 60s;
        proxy_pass http://frontend;
    }

    # Never serve dotfiles (except /.well-known/, used for TLS challenges etc.).
    location ~ /\.(?!well-known) {
        deny all;
    }
}
